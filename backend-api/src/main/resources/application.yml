spring:
  datasource:
    url: jdbc:mysql://localhost:3366/personal_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: your_email@gmail.com         # Thay bằng email của bạn
    password: your_app_password_or_token   # Thay bằng mật khẩu ứng dụng (App Password)
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

    # Dùng để sinh URL xác thực tài khoản
    verify:
      host: http://localhost:8099

server:
  port: 8099
  servlet:
    context-path: /api/v1

